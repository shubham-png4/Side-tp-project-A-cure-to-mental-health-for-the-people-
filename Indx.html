<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Chess Platform</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #181818; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .navbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        button { background: #333; color: #fff; border: 1px solid #555; padding: 10px 16px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        button.active, button:hover { background: #4CAF50; border-color: #4CAF50; }
        #game-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        #board { display: grid; grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(8, 60px); border: 4px solid #404040; }
        .sq { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 38px; cursor: pointer; user-select: none; }
        .white { background: #eeeed2; color: #000; }
        .black { background: #769656; color: #000; }
        .selected { background: #baca44 !important; }
        #sidebar { width: 280px; background: #242424; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .coach-msg { background: #2d3748; border-left: 4px solid #4299e1; padding: 10px; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="navbar">
        <button onclick="setMode('multiplayer')">🌐 Online Friends</button>
        <button onclick="setMode('puzzles')">🧩 Puzzles</button>
        <button onclick="setMode('coach')">🎓 AI Coach</button>
        <button onclick="setMode('local')">👥 Pass & Play</button>
        <button onclick="setMode('bot')">🤖 Play Bots</button>
        <button onclick="setMode('tournament')">🏆 Tournaments</button>
    </div>

    <div id="game-container">
        <div id="board"></div>

        <div id="sidebar">
            <h3 id="mode-title">Select a Mode</h3>
            <div id="status">Ready</div>

            <!-- Dynamic Controls based on active mode -->
            <div id="mode-controls" style="margin-top: 15px;"></div>
            <div id="coach-box" class="coach-msg" style="display:none;"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
